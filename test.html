<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My First GitHub Push</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      line-height: 1.6;
    }
    header {
      background: #1f6feb;
      color: #fff;
      text-align: center;
      padding: 40px 20px;
    }
    main {
      max-width: 700px;
      margin: 24px auto;
      padding: 0 16px;
    }
    section {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }
    h2 { margin-bottom: 8px; }
    button {
      background: #1f6feb;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: #1558c0; }
    footer { text-align: center; padding: 20px; color: #666; }
  </style>
</head>
<body>

  <header>
    <h1>Hello, GitHub! 👋</h1>
    <p>This is my first push practice page.</p>
  </header>

  <main>
    <section>
      <h2>About Me</h2>
      <p>My name is Harsh. I am learning Git and GitHub.</p>
    </section>

    <section>
      <h2>Git Commands I Learned</h2>
      <ul>
        <li>git init</li>
        <li>git add .</li>
        <li>git commit -m "message"</li>
        <li>git push origin main</li>
      </ul>
    </section>

    <section>
      <h2>Try It</h2>
      <button onclick="showMessage()">Click me</button>
      <p id="msg"></p>
    </section>
  </main>

  <footer>Made with ❤️ for GitHub practice</footer>

  <script>
    function showMessage() {
      document.getElementById("msg").textContent = "Push successful! 🎉";
    }
  </script>
</body>
</html>
