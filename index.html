<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Animation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; color: #fff; overflow: hidden; }

    /* Sky backgrounds */
    #sky {
      position: fixed; inset: 0;
      transition: background 1s;
      background: linear-gradient(#4aa8ff, #bfe3ff);
    }
    #sky.sunny  { background: linear-gradient(#2e9bff, #bfe3ff); }
    #sky.cloudy { background: linear-gradient(#7d8b99, #c3cbd3); }
    #sky.rainy  { background: linear-gradient(#3b4754, #6c7a89); }
    #sky.snowy  { background: linear-gradient(#8fa6bd, #e6eef6); }
    #sky.stormy { background: linear-gradient(#1d2430, #3a4556); }

    /* UI */
    .panel {
      position: relative; z-index: 10;
      text-align: center; padding: 24px 16px;
    }
    h1 { font-size: 1.6rem; margin-bottom: 6px; }
    #info { font-size: 2.2rem; margin: 10px 0; text-shadow: 0 2px 8px rgba(0,0,0,.3); }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
    button, input {
      padding: 9px 14px; border-radius: 20px; border: none; font-size: 1rem;
    }
    button { background: rgba(255,255,255,.85); color: #222; cursor: pointer; }
    button:hover, button.active { background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.5); }
    input { width: 180px; }

    /* Sun */
    #sun {
      display: none; position: absolute; top: 28%; left: 50%;
      width: 120px; height: 120px; margin-left: -60px;
      background: #ffd93b; border-radius: 50%;
      box-shadow: 0 0 60px 20px rgba(255,217,59,.7);
      animation: pulse 3s ease-in-out infinite;
    }
    #sky.sunny #sun { display: block; }
    @keyframes pulse { 50% { transform: scale(1.08); } }

    /* Clouds */
    .cloud {
      display: none; position: absolute; width: 140px; height: 45px;
      background: #fff; border-radius: 50px; opacity: .9;
      animation: drift linear infinite;
    }
    .cloud::before, .cloud::after {
      content: ""; position: absolute; background: #fff; border-radius: 50%;
    }
    .cloud::before { width: 60px; height: 60px; top: -28px; left: 20px; }
    .cloud::after  { width: 45px; height: 45px; top: -20px; left: 70px; }
    #sky.sunny .cloud.c1, #sky.sunny .cloud.c2 { display: block; }
    #sky.cloudy .cloud, #sky.rainy .cloud, #sky.snowy .cloud, #sky.stormy .cloud { display: block; }
    #sky.rainy .cloud, #sky.stormy .cloud { background: #5b6672; }
    #sky.rainy .cloud::before, #sky.rainy .cloud::after,
    #sky.stormy .cloud::before, #sky.stormy .cloud::after { background: #5b6672; }
    .c1 { top: 22%; animation-duration: 40s; }
    .c2 { top: 40%; animation-duration: 55s; animation-delay: -20s; transform: scale(1.3); }
    .c3 { top: 15%; animation-duration: 48s; animation-delay: -35s; }
    .c4 { top: 55%; animation-duration: 62s; animation-delay: -10s; transform: scale(.8); }
    @keyframes drift { from { left: -200px; } to { left: 110%; } }

    /* Rain & snow particles (created by JS) */
    .drop {
      position: absolute; top: -20px; width: 2px; height: 16px;
      background: rgba(190,220,255,.8); animation: fall linear infinite;
    }
    .flake {
      position: absolute; top: -20px; width: 8px; height: 8px;
      background: #fff; border-radius: 50%; animation: fall linear infinite;
    }
    @keyframes fall { to { transform: translateY(110vh); } }

    /* Lightning */
    #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 5; }
    #sky.stormy ~ #flash { animation: flash 5s infinite; }
    @keyframes flash {
      0%, 88%, 92%, 100% { opacity: 0; }
      90%, 94% { opacity: .8; }
    }
  </style>
</head>
<body>

  <div id="sky" class="sunny">
    <div id="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
    <div id="particles"></div>
  </div>
  <div id="flash"></div>

  <div class="panel">
    <h1>Weather Animation</h1>
    <div id="info">☀️ Sunny</div>

    <div class="controls" id="buttons">
      <button data-w="sunny">☀️ Sunny</button>
      <button data-w="cloudy">☁️ Cloudy</button>
      <button data-w="rainy">🌧️ Rainy</button>
      <button data-w="snowy">❄️ Snowy</button>
      <button data-w="stormy">⛈️ Stormy</button>
    </div>

    <div class="controls">
      <input id="city" placeholder="Enter city (e.g. Jaipur)">
      <button onclick="getLiveWeather()">Get live weather</button>
    </div>
  </div>

  <script>
    const sky = document.getElementById("sky");
    const info = document.getElementById("info");
    const particles = document.getElementById("particles");

    const labels = {
      sunny: "☀️ Sunny", cloudy: "☁️ Cloudy", rainy: "🌧️ Rainy",
      snowy: "❄️ Snowy", stormy: "⛈️ Stormy"
    };

    function setWeather(type, extra = "") {
      sky.className = type;
      info.textContent = labels[type] + extra;
      particles.innerHTML = "";

      if (type === "rainy" || type === "stormy") makeParticles("drop", 120, 0.5, 1.0);
      if (type === "snowy") makeParticles("flake", 80, 4, 8);

      document.querySelectorAll("#buttons button").forEach(b =>
        b.classList.toggle("active", b.dataset.w === type));
    }

    function makeParticles(cls, count, minDur, maxDur) {
      for (let i = 0; i < count; i++) {
        const p = document.createElement("div");
        p.className = cls;
        p.style.left = Math.random() * 100 + "%";
        p.style.animationDuration = (minDur + Math.random() * (maxDur - minDur)) + "s";
        p.style.animationDelay = (-Math.random() * maxDur) + "s";
        particles.appendChild(p);
      }
    }

    document.querySelectorAll("#buttons button").forEach(b =>
      b.addEventListener("click", () => setWeather(b.dataset.w)));

    // Live weather using the free Open-Meteo API (no key needed)
    async function getLiveWeather() {
      const city = document.getElementById("city").value.trim();
      if (!city) return;
      try {
        const geo = await (await fetch(
          "https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + encodeURIComponent(city)
        )).json();
        if (!geo.results) { info.textContent = "City not found"; return; }
        const { latitude, longitude, name } = geo.results[0];

        const w = await (await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`
        )).json();
        const code = w.current_weather.weathercode;
        const temp = Math.round(w.current_weather.temperature);

        let type = "sunny";
        if (code >= 1 && code <= 48) type = "cloudy";
        if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) type = "rainy";
        if ((code >= 71 && code <= 77) || code === 85 || code === 86) type = "snowy";
        if (code >= 95) type = "stormy";

        setWeather(type, ` · ${temp}°C · ${name}`);
      } catch (e) {
        info.textContent = "Could not load weather";
      }
    }

    setWeather("sunny");
  </script>
</body>
</html>
